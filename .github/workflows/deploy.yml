name: Verify and deploy Mi Apiario 3D

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; a newer push waits instead of being overtaken by an older run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Unit and flow tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Browser tests (desktop + mobile, 3D scene)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload built site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only publishes the exact dist/ that passed every check above.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
